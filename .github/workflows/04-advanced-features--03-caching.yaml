name: Caching
on:
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # 2) Generic cache with actions/cache/restore and save
  # ──────────────────────────────────────────────
  actions-cache:
    name: Prime demo cache
    runs-on: ubuntu-24.04
    steps:
    # 1. Restore only
    - name: Restore cache
      id: demo-cache
      uses: actions/cache/restore@638ed79f9dc94c1de1baef91bcab5edaa19451f4 # v4.2.4
      with:
        path: demo-cache
        key: demo-cache-v1

    # 2. Build on miss
    - name: Populate cache directory
      if: steps.demo-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p demo-cache
        date > demo-cache/timestamp.txt

    # 3. Explicit save step (only saves, does not restore)
    - name: Save cache
      if: steps.demo-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@638ed79f9dc94c1de1baef91bcab5edaa19451f4 # v4.2.4
      with:
        path: demo-cache
        key: demo-cache-v1

  # ──────────────────────────────────────────────
  # 3) Cache via actions/setup-node
  # ──────────────────────────────────────────────
  node-cache:
    name: npm dependency cache (setup-node)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 04-advanced-features/caching/minimal-node-project

    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
      - uses: actions/setup-node@d7a11313b581b306c961b506cfc8971208bb03f6 # v4.4.0
        with:
          node-version: 20
          cache: npm
          # Point cache action at the specific lock-file path
          cache-dependency-path: 04-advanced-features/caching/minimal-node-project/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: List first few modules
        run: ls -R node_modules | head
